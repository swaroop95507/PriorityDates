<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Priority Date Dashboard</title>
    <style>
        :root {
            --bg: #fafafa;
            --surface: #ffffff;
            --border: #eaeaea;
            --text: #111111;
            --muted: #666666;
            --accent-red: #da3633;
            --accent-gray: #888888;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 60px 20px;
            line-height: 1.4;
        }

        .wrapper {
            max-width: 680px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 40px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin: 0 0 6px 0;
            letter-spacing: -0.02em;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--muted);
            margin: 0;
        }

        .profile-strip {
            display: flex;
            gap: 24px;
            padding: 16px 0;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            margin-bottom: 32px;
            font-size: 0.85rem;
        }

        .profile-item span {
            color: var(--muted);
            display: block;
            margin-bottom: 2px;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
        }

        .profile-item strong {
            font-weight: 500;
        }

        .stack {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .row {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            display: grid;
            grid-template-columns: 80px 160px 1fr;
            align-items: center;
        }

        .cat {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .cat small {
            display: block;
            font-size: 0.75rem;
            font-weight: 400;
            color: var(--muted);
            margin-top: 2px;
        }

        .cutoff-val {
            font-size: 0.95rem;
            font-weight: 500;
        }

        .status-msg {
            font-size: 0.85rem;
            text-align: right;
            color: var(--accent-red);
        }

        .status-msg.unavailable {
            color: var(--accent-gray);
        }

        footer {
            margin-top: 40px;
            font-size: 0.8rem;
            color: var(--muted);
            text-align: center;
        }

        footer a {
            color: var(--text);
            text-decoration: underline;
        }

        @media (max-width: 550px) {
            .row {
                grid-template-columns: 1fr;
                gap: 12px;
            }
            .status-msg {
                text-align: left;
                margin-top: 4px;
            }
        }
    </style>
</head>
<body>

<div class="wrapper">
    <header>
        <h1>Priority Date Tracker</h1>
        <p class="subtitle">September 2026 Visa Bulletin • Final Action Dates</p>
    </header>

    <div class="profile-strip">
        <div class="profile-item">
            <span>Chargeability</span>
            <strong>India</strong>
        </div>
        <div class="profile-item">
            <span>Your Target PD</span>
            <strong>June 17, 2024</strong>
        </div>
    </div>

    <div class="stack" id="dashboard">
        <!-- Rows dynamically rendered by JS -->
    </div>

    <footer>
        Data source: <a href="https://state.gov" target="_blank">U.S. Department of State</a>
    </footer>
</div>

<script>
    // Configuration Data (September 2026 Visa Bulletin Rules for India)
    const targetPD = new Date('2024-06-17');
    const data = [
        { cat: 'EB-1', label: 'Priority Workers', cutoff: '2022-10-15' },
        { cat: 'EB-2', label: 'Advanced Deg.', cutoff: 'U' }, // 'U' stands for Unavailable
        { cat: 'EB-3', label: 'Professional', cutoff: '2014-01-01' }
    ];

    function calculateWait(cutoffStr, userDate) {
        if (cutoffStr === 'U') return { msg: 'Category Temporarily Unavailable', style: 'unavailable', dateText: 'Unavailable (U)' };
        
        const cutoffDate = new Date(cutoffStr);
        const formatOptions = { year: 'numeric', month: 'short', day: '2-digit' };
        const dateText = cutoffDate.toLocaleDateString('en-US', formatOptions);

        if (userDate < cutoffDate) {
            return { msg: 'Current', style: 'current', dateText };
        }

        // Calculate chronological distance
        const diffTime = Math.abs(userDate - cutoffDate);
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        
        if (diffDays >= 365) {
            const years = (diffDays / 365).toFixed(1);
            return { msg: `${years} years behind cutoff`, style: 'backlogged', dateText };
        }
        return { msg: `${diffDays} days behind cutoff`, style: 'backlogged', dateText };
    }

    const container = document.getElementById('dashboard');

    data.forEach(item => {
        const result = calculateWait(item.cutoff, targetPD);
        
        const row = document.createElement('div');
        row.className = 'row';
        row.innerHTML = `
            <div class="cat">
                ${item.cat}
                <small>${item.label}</small>
            </div>
            <div class="cutoff-val">
                ${result.dateText}
            </div>
            <div class="status-msg ${result.style}">
                ${result.msg}
            </div>
        `;
        container.appendChild(row);
    });
</script>

</body>
</html>
